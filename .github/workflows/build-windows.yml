name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-qt6-base
          mingw-w64-ucrt-x86_64-qt6-multimedia
          mingw-w64-ucrt-x86_64-ffmpeg

    - name: Build FMusic Executable
      shell: msys2 {0}
      run: |
        set -e
        rm -rf windows/build
        cd windows
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    - name: Bundle DLLs
      shell: msys2 {0}
      run: |
        set -e
        cd windows/build

        # 1) Plugin và DLL của Qt
        windeployqt6 --no-translations AppleStylePlayer.exe

        # 2) Runtime của MinGW: copy thẳng
        cp -n /ucrt64/bin/libstdc++-6.dll /ucrt64/bin/libgcc_s_seh-1.dll /ucrt64/bin/libwinpthread-1.dll .

        # 3) Mọi DLL phụ thuộc (FFmpeg, libaom, ...). Quét lặp vì có DLL lồng nhau
        for i in 1 2 3 4 5; do
          for f in AppleStylePlayer.exe $(find . -name '*.dll'); do
            ldd "$f" 2>/dev/null | grep -i '/ucrt64/' | awk '{print $3}' | xargs -r -I{} cp -n "{}" .
          done
        done

        # 4) Kiểm tra: thiếu DLL nào là CI báo đỏ ngay
        echo "So DLL: $(ls *.dll | wc -l)"
        for d in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll libaom.dll avcodec-*.dll avformat-*.dll swresample-*.dll swscale-*.dll Qt6Core.dll Qt6Multimedia.dll; do
          ls $d >/dev/null || { echo "THIEU $d"; exit 1; }
        done

        # 5) Gói gọn: chỉ giữ file cần chạy
        mkdir -p ../dist
        cp -r *.exe *.dll plugins platforms styles imageformats multimedia tls generic iconengines networkinformation ../dist/ 2>/dev/null || true

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: FMusic-Windows-Portable
        path: windows/dist/
        if-no-files-found: error
