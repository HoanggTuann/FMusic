name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-qt6-base
          mingw-w64-ucrt-x86_64-qt6-multimedia
          mingw-w64-ucrt-x86_64-ffmpeg

    - name: Build FMusic
      shell: msys2 {0}
      run: |
        set -e
        rm -rf windows/build
        cd windows
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    - name: Bundle DLLs
      shell: msys2 {0}
      run: |
        cd windows/build

        # 1) Plugin và DLL của Qt (bỏ bản dịch vì MSYS2 không có catalogs.json)
        windeployqt6 --no-translations FMusic.exe || true

        # 2) Hàm copy: bỏ qua nếu đã có, không bao giờ trả mã lỗi
        copy_dll() { [ -e "./$(basename "$1")" ] || cp "$1" . ; return 0; }

        # 3) Runtime của MinGW
        for d in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
          copy_dll "/ucrt64/bin/$d"
        done

        # 4) Mọi DLL phụ thuộc (FFmpeg, libaom, ...). Quét lặp vì có DLL lồng nhau
        for i in 1 2 3 4 5; do
          for f in FMusic.exe $(find . -name '*.dll'); do
            for dep in $(ldd "$f" 2>/dev/null | grep -i '/ucrt64/' | awk '{print $3}'); do
              copy_dll "$dep"
            done
          done
        done

        # 5) Kiểm tra: thiếu DLL nào là CI báo đỏ ngay
        echo "So DLL: $(ls *.dll | wc -l)"
        missing=0
        for d in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll libaom.dll avcodec-*.dll avformat-*.dll swresample-*.dll swscale-*.dll Qt6Core.dll Qt6Multimedia.dll; do
          if ! ls $d >/dev/null 2>&1; then echo "THIEU $d"; missing=1; fi
        done
        [ "$missing" = "0" ] || exit 1

        # 6) Gói gọn: chỉ giữ file cần chạy
        mkdir -p ../dist
        cp -r FMusic.exe *.dll generic imageformats multimedia networkinformation platforms styles tls ../dist/ 2>/dev/null || true
        ls ../dist | head -50

    - name: Build installer (Inno Setup)
      shell: pwsh
      run: |
        # Kiểm tra các tệp cần có để lỗi nói rõ thiếu gì
        foreach ($f in @("installer\FMusic.iss", "windows\dist\FMusic.exe", "windows\icon\fmusic.ico")) {
          if (!(Test-Path $f)) { Write-Error "THIEU tep trong repo: $f"; exit 1 }
        }
        choco install innosetup -y --no-progress
        $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.3.0" }
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\FMusic.iss
        Get-ChildItem installer-out

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: FMusic-Setup
        path: installer-out/*.exe
        if-no-files-found: error

    - name: Upload portable (zip các file)
      uses: actions/upload-artifact@v4
      with:
        name: FMusic-Windows-Portable
        path: windows/dist/
        if-no-files-found: error

    - name: Publish GitHub Release (khi đẩy tag vX.Y.Z)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: installer-out/*.exe
        generate_release_notes: true
