name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-qt6-base
          mingw-w64-ucrt-x86_64-qt6-multimedia
          mingw-w64-ucrt-x86_64-ffmpeg

    - name: Build FMusic
      shell: msys2 {0}
      run: |
        set -e
        rm -rf windows/build
        cd windows
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    - name: Bundle DLLs
      shell: msys2 {0}
      run: |
        cd windows/build

        # 1) Plugin và DLL của Qt
        windeployqt6 --no-translations FMusic.exe || true

        # 2) Hàm copy
        copy_dll() { [ -e "./$(basename "$1")" ] || cp "$1" . ; return 0; }

        # 3) Runtime của MinGW
        for d in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
          copy_dll "/ucrt64/bin/$d"
        done

        # 4) Quét và copy DLL phụ thuộc
        for i in 1 2 3 4 5; do
          for f in FMusic.exe $(find . -name '*.dll'); do
            for dep in $(ldd "$f" 2>/dev/null | grep -i '/ucrt64/' | awk '{print $3}'); do
              copy_dll "$dep"
            done
          done
        done

        # 5) Kiểm tra DLL cốt lõi
        missing=0
        for d in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll libaom.dll avcodec-*.dll avformat-*.dll swresample-*.dll swscale-*.dll Qt6Core.dll Qt6Multimedia.dll; do
          if ! ls $d >/dev/null 2>&1; then echo "THIEU $d"; missing=1; fi
        done
        [ "$missing" = "0" ] || exit 1

        # 6) Gom vào windows/dist
        mkdir -p ../dist
        cp -r FMusic.exe *.dll generic imageformats multimedia networkinformation platforms styles tls ../dist/ 2>/dev/null || true
        ls ../dist | head -50

    - name: Build Inno Setup Installer
      shell: cmd
      run: |
        choco install innosetup --no-progress -y
        set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if not exist "%ISCC%" set "ISCC=C:\Program Files\Inno Setup 6\ISCC.exe"
        if not exist "%ISCC%" for /f "delims=" %%i in ('where iscc 2^>nul') do set "ISCC=%%i"
        "%ISCC%" /DMyAppVersion=1.1.0 Installer\FMusic.iss

    - name: Upload Windows Setup Installer (.exe cài đặt)
      uses: actions/upload-artifact@v4
      with:
        name: FMusic-Windows-Setup-Installer
        path: installer-out/*.exe
        if-no-files-found: error

    - name: Upload Windows Portable
      uses: actions/upload-artifact@v4
      with:
        name: FMusic-Windows-Portable
        path: windows/dist/
        if-no-files-found: error
