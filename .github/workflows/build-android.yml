name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Android FFmpeg
        id: ffmpeg-android-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs
          key: ffmpeg-android-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}

      - name: Build Android FFmpeg
        if: steps.ffmpeg-android-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f "./scripts/build-ffmpeg-android.sh" ]; then
            chmod +x ./scripts/build-ffmpeg-android.sh
            ./scripts/build-ffmpeg-android.sh
          fi

      - name: Prepare Gradle Wrapper
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            echo "gradlew không có sẵn, đang sinh gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FMusic-Android-Release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
